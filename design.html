function render(){
  const page=document.getElementById('page');
  let h='';

  h+=`<div class="masthead">
    <div class="mast-top">
      <div class="mast-name">THE WORLD IN ONE DAY</div>
      <div class="mast-center"><div class="mast-date">WEDNESDAY 25 NOVEMBER 2026</div>
      <div class="mast-deck"><b>ONE IMAGE · 35 STORIES · 7 REGIONS</b> · ALL EVENTS OF 25 NOVEMBER, ANY TIME ZONE</div></div>
      <div class="mast-right">Vol. 11 · No. 25<br>News Digest</div>
    </div>
  </div>`;

  h+=`<div class="region-band">${REGIONS.map(r=>`<div class="region" style="background:${r.color}">
    <b>${r.name}</b><span>${r.count} stories</span></div>`).join('')}</div>`;

  h+=`<div class="numbers">${NUMBERS.map(n=>`<div class="num"><b>${n.v}</b><span>${n.cap}</span></div>`).join('')}</div>`;

  const leads=STORIES.filter(s=>s.section==='lead');
  h+=`<div class="sec-head"><span class="sec-no">01</span><h2>The Lead</h2><span class="rule"></span><span class="aside">the day, in three dispatches</span></div>
      <div class="leads">${leads.map(s=>`<div class="lead" style="border-top-color:${REG[s.region]}">
        <div class="lead-kick">${REGNAME[s.region]}<span class="tag">${s.tag||''}</span></div>
        <div class="lead-art">${art(s.art,REG[s.region])}</div>
        <div class="lead-title">${s.title}</div>
        <div class="lead-body">${s.body}</div>
        <div class="lead-src">${s.src}</div>
      </div>`).join('')}</div>`;

  const cards=STORIES.filter(s=>s.section==='card');
  h+=`<div class="sec-head"><span class="sec-no">02</span><h2>The Cards</h2><span class="rule"></span><span class="aside">${cards.length} more, across regions</span></div>
      <div class="cards">${cards.map(s=>`<div class="card" style="border-top-color:${REG[s.region]}">
        <div class="card-art">${art(s.art,REG[s.region])}</div>
        <div class="card-txt">
          <div class="card-title">${s.title}</div>
          <div class="card-body">${s.body}</div>
          <div class="card-meta">${REGNAME[s.region]}<b> · </b>${s.src}</div>
        </div>
      </div>`).join('')}</div>`;

  const briefs=STORIES.filter(s=>s.section==='brief');
  h+=`<div class="sec-head"><span class="sec-no">03</span><h2>The Briefs</h2><span class="rule"></span><span class="aside">${briefs.length} short, one line each</span></div>
      <div class="briefs">${briefs.map((s,i)=>`<div class="brief"><span class="n">${s.id}</span>${s.title}<span class="src">${REGNAME[s.region]} · ${s.src}</span></div>`).join('')}</div>`;

  h+=`<div class="map-section">
    <div class="sec-head" style="margin-top:0"><span class="sec-no">04</span><h2>Where It Happened</h2><span class="rule"></span><span class="aside">25 November 2026</span></div>
    <div class="map-holder"><svg class="map-svg" viewBox="0 0 1000 62" preserveAspectRatio="none">
      <rect width="1000" height="62" fill="#1B1A17"/>
      ${MAP.map(p=>`<circle class="pin" cx="${p.x*10}" cy="${p.y*1.5}" r="3.4"/>`).join('')}
      <text class="map-region" x="200" y="30">EUROPE</text>
      <text class="map-region" x="520" y="26">MIDDLE EAST</text>
      <text class="map-region" x="520" y="46">AFRICA</text>
      <text class="map-region" x="700" y="24">ASIA</text>
      <text class="map-region" x="260" y="50">AMERICAS</text>
      <text class="map-region" x="870" y="40">OCEANIA</text>
    </svg><div class="map-key">Dots mark the regions covered · 7 regions</div><div class="map-note">25 November 2026 · any time zone</div></div></div>`;

  h+=`<div class="date-check">
    <div class="dc-label">DATE CHECK</div>
    <div class="dc-text"><b>Wednesday 25 November 2026.</b> Every story on this page happened on 25 November 2026 or was first reported that day, in any time zone. No earlier day, no later day.</div>
    <div class="dc-tags"><b>REGIONS</b> Europe · Middle East · Africa · Asia · Americas · Oceania · Global<br>
      <b>SOURCES</b> AP · Reuters · BBC · Al Jazeera · DW · AFP-linked services · official filings</div>
  </div>`;

  page.insertAdjacentHTML('beforeend',h);
}
render();

// Layout QA: record overflow/clipping so the headless DOM dump can be checked.
(function(){
  const page=document.getElementById('page');
  const clipped=[];
  document.querySelectorAll('.lead-title,.lead-body,.card-title,.card-body,.brief,.lead-src,.card-meta,.lead-kick').forEach(el=>{
    if(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1){
      clipped.push({cls:el.className,txt:(el.textContent||'').slice(0,32),sh:el.scrollHeight,ch:el.clientHeight,sw:el.scrollWidth,cw:el.clientWidth});
    }
  });
  const qa={docH:document.documentElement.scrollHeight,pageH:page.scrollHeight,
    leads:document.querySelectorAll('.lead').length,cards:document.querySelectorAll('.card').length,
    briefs:document.querySelectorAll('.brief').length,clippedCount:clipped.length,clipped:clipped.slice(0,12)};
  page.setAttribute('data-qa',JSON.stringify(qa));
})();
</script>
