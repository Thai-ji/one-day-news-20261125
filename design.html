function proj(lon,lat){return [ (lon-LON0)/(LON1-LON0)*MAP_W, (LAT1-lat)/(LAT1-LAT0)*MAP_H ];}
function inPoly(x,y,pts){let odd=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!==(yj>y))&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)odd=!odd;}return odd;}

// expose measurements for QA
window.__measure=()=>{
  const out=[];
  document.querySelectorAll('.masthead,.region-band,.numbers,.headlines,.map-section,.cards-section,.briefs-section,.date-check').forEach(el=>{
    const r=el.getBoundingClientRect(); out.push({cls:el.className,top:+r.top.toFixed(1),bottom:+r.bottom.toFixed(1),height:+r.height.toFixed(1)});
  });
  const cards=[...document.querySelectorAll('.card')].map(el=>{const r=el.getBoundingClientRect();return {t:r.top,b:r.bottom,h:r.height,scroll:el.scrollHeight};});
  const briefs=[...document.querySelectorAll('.brief')].map(el=>({n:el.querySelector('.n')?.textContent||'',text:el.textContent.slice(0,60),h:el.clientHeight,scroll:el.scrollHeight}));
  return {sections:out,cards,briefs,docH:document.documentElement.scrollHeight,bodyH:document.body.scrollHeight};
};
document.body.setAttribute('data-measure', JSON.stringify(window.__measure()));
